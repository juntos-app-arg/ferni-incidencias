    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ========================================

        const firebaseConfig = {
          apiKey: "AIzaSyASCknH-hS84WKM4sGFehfVraXKm6T-ob0",

          appId: "1:744424538106:web:8392fbe4f3e8c9b5e7c8d9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();
        const auth = firebase.auth();

        // Nota sobre la apiKey: en Firebase Web NO es un secreto (identifica al
        // proyecto, no autoriza). Lo que realmente protege los datos son las
        // Security Rules + Auth. Ver firestore.rules / storage.rules.
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});

        // ========================================
        // AUTENTICACION
        // ========================================
        // Todo usuario (empleado, lider, encargado) obtiene una sesion ANONIMA de
        // Firebase. Es lo que permite que las reglas exijan request.auth != null y
        // que la base deje de estar abierta a cualquiera con la URL del proyecto.
        const asegurarAuth = async () => {
          if (auth.currentUser) return auth.currentUser;
          try {
            const cred = await auth.signInAnonymously();
            return cred.user;
          } catch (err) {
            console.warn(
              'No se pudo iniciar sesion anonima (' + (err.code || err.message) + '). ' +
              'Activar Firebase Console > Authentication > Sign-in method > Anonymous.'
            );
            return null;
          }
        };

        // Un usuario es admin SOLO si existe el documento admins/{uid} en Firestore.
        // Nunca porque el localStorage o el codigo del cliente lo digan.
        const obtenerPerfilAdmin = async (user) => {
          if (!user || user.isAnonymous) return null;
          try {
            const doc = await db.collection('admins').doc(user.uid).get();
            return doc.exists ? Object.assign({ uid: user.uid, email: user.email }, doc.data()) : null;
          } catch (err) {
            console.error('No se pudo verificar el perfil de admin:', err);
            return null;
          }
        };

        const mensajeAuthError = (err) => {
          switch (err && err.code) {
            case 'auth/invalid-email':          return 'El email no es valido.';
            case 'auth/user-disabled':          return 'Este usuario esta deshabilitado.';
            case 'auth/user-not-found':
            case 'auth/wrong-password':
            case 'auth/invalid-credential':     return 'Email o contrasena incorrectos.';
            case 'auth/too-many-requests':      return 'Demasiados intentos. Espera unos minutos.';
            case 'auth/network-request-failed': return 'Sin conexion. Revisa tu internet.';
            case 'auth/operation-not-allowed':  return 'El acceso con email no esta habilitado en Firebase.';
            default:                            return 'No se pudo iniciar sesion. Intenta de nuevo.';
          }
        };

        // ========================================
        // UTILIDADES DE SEGURIDAD
        // ========================================
        // 32 caracteres sin ambiguos (0/O, 1/I/L): 256 % 32 === 0, sin sesgo de modulo.
        const ALFABETO_CODIGO = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        const tokenSeguro = (largo = 6) => {
          const cr = window.crypto || window.msCrypto;
          const buf = new Uint8Array(largo);
          cr.getRandomValues(buf);
          let out = '';
          for (let i = 0; i < largo; i++) out += ALFABETO_CODIGO[buf[i] % 32];
          return out;
        };

        const emailValido = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v || '').trim());
        const limpiarTexto = (v, max) => String(v == null ? '' : v).replace(/\s+$/, '').slice(0, max);
        const abrirExterno = (url) => window.open(url, '_blank', 'noopener,noreferrer');

        // ========================================
        // CONSTANTES
        // ========================================
        const DIAS_RETENCION = 90;
        const MAX_DESCRIPCION   = 1000;          // caracteres
        const MAX_COMENTARIO    = 500;           // caracteres
        const MAX_ARCHIVO_BYTES = 20 * 1024 * 1024;   // 20 MB de entrada
        const MAX_BASE64_BYTES  = 800 * 1024;    // margen bajo el limite de 1 MB por doc de Firestore
        const LIMITE_REPORTES   = 300;           // tope de documentos escuchados en vivo
        const SESSION_TTL_MS    = 12 * 60 * 60 * 1000;  // la sesion local caduca a las 12 h
        const LIMPIEZA_MIN_MS   = 24 * 60 * 60 * 1000;  // limpieza de fotos: 1 vez por dia

        // Los administradores YA NO viven en el codigo.
        // Antes habia un array ADMINS con email + contrasena en texto plano dentro de
        // este archivo: cualquiera que abriera "Ver codigo fuente" tenia las 3 claves.
        // Ahora se crean en Firebase Console > Authentication (Email/Password) y se
        // les da el rol creando el documento  admins/{uid}  en Firestore.
        // Ver MIGRACION.md.

        // App exclusiva FERNI 3
        const SUCURSAL_ID = 'F3';
        const SUCURSAL_NOMBRE = 'FERNI 3';
        // Array para compatibilidad con SUCURSALES.find() existente
        const SUCURSALES = [{ id: 'F3', nombre: 'FERNI 3' }];

        const CATEGORIAS = [
          { id: 'visual', nombre: 'Exhibiciones', color: '#4ECDC4', icon: '🎯' },
          { id: 'limpieza', nombre: 'Limpieza y Orden', color: '#F0EDE8', icon: '🧹' },
          { id: 'mantenimiento', nombre: 'Mantenimiento', color: '#FFB84D', icon: '🔧' },
          { id: 'inventario', nombre: 'Inventario', color: '#FF6B35', icon: '📦' },
          { id: 'ambiental', nombre: 'Mejoras Ambientales', color: '#4DFF91', icon: '♻️' }
        ];

        // Módulos activos en F3
        const SUCURSALES_CON_HORARIOS = ['F3'];
        const SUCURSALES_CON_VENCIMIENTOS = ['F3'];

        // ========================================
        // CONSTANTES MÓDULO ASISTENTE
        // ========================================
        const ASISTENTE_WORKER_URL = 'https://misty-term-8dc5ferni-asistente.lucas-ramirez2210.workers.dev/';
        const SUGERENCIAS_INICIALES = [
          '¿Cuántos días tengo por casamiento?',
          '¿Cómo solicito un adelanto de sueldo?',
          'Garantía de productos Liliana',
          '¿Cómo armo una puntera?',
          'Qué hago ante un accidente laboral'
        ];

        // Áreas por defecto que se crean al activar el módulo en una sucursal
        const AREAS_DEFAULT = [
          { id: 'perfumeria',       nombre: 'Perfumería',        color: '#E24B4A', roles: ['Líder Perfumería'] },
          { id: 'cajas',            nombre: 'Cajas',             color: '#1D9E75', roles: ['Líder Cajas', 'Co Líder Cajas'] },
          { id: 'golosinas',        nombre: 'Golosinas',         color: '#FAC775', roles: ['Líder Golosinas'] },
          { id: 'deposito',         nombre: 'Depósito',          color: '#378ADD', roles: ['Líder Depósito'] },
          { id: 'textil',           nombre: 'Textil',            color: '#8B5CF6', roles: ['Líder Textil'] },
          { id: 'vigilancia',       nombre: 'Vigilancia',        color: '#888780', roles: ['Líder Vigilancia'] },
          { id: 'colider',          nombre: 'Colíder',           color: '#FF6B35', roles: ['Colíder'] },
          { id: 'control_gestion',  nombre: 'Control de Gestión',color: '#AFA9EC', roles: ['Control de Gestión'] },
        ];

        // Rubros habilitados para el módulo de Vencimientos (subconjunto de AREAS_DEFAULT)
        const RUBROS_VENCIMIENTOS = AREAS_DEFAULT.filter(a => ['perfumeria', 'golosinas'].includes(a.id));

        const TURNOS_TIPICOS = [
          { label: 'Mañana corta', entrada: '08:00', salida: '14:00' },
          { label: 'Mañana larga', entrada: '07:30', salida: '15:30' },
          { label: 'Mediodía', entrada: '10:00', salida: '18:00' },
          { label: 'Centro', entrada: '12:00', salida: '20:00' },
          { label: 'Tarde corta', entrada: '17:00', salida: '21:30' },
          { label: 'Tarde larga', entrada: '14:00', salida: '21:30' },
        ];

        // ========================================
        // HELPERS DE FECHA
        // ========================================
        const getFecha = (campo) => {
          if (!campo) return null;
          if (campo.toDate) return campo.toDate();
          return new Date(campo);
        };

        const formatFecha = (campo) => {
          const fecha = getFecha(campo);
          if (!fecha || isNaN(fecha)) return 'N/A';
          return fecha.toLocaleString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        };

        // ========================================
        // COMPRIMIR FOTO
        // ========================================
        const validarArchivoImagen = (file) => {
          if (!file) return 'No se selecciono ninguna foto.';
          if (!/^image\//.test(file.type || '')) return 'El archivo debe ser una imagen.';
          if (file.size > MAX_ARCHIVO_BYTES) return 'La imagen supera los 20 MB.';
          return null;
        };

        const comprimirFoto = (file, maxWidth = 1280, quality = 0.72) => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                  height = (height * maxWidth) / width;
                  width = maxWidth;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                canvas.toBlob((blob) => {
                  if (blob) {
                    const compressedFile = new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() });
                    console.log(`✅ Foto comprimida: ${(file.size/1024).toFixed(0)}KB → ${(blob.size/1024).toFixed(0)}KB`);
                    resolve(compressedFile);
                  } else reject(new Error('Error al comprimir'));
                }, 'image/jpeg', quality);
              };
              img.onerror = () => reject(new Error('Error al cargar imagen'));
              img.src = e.target.result;
            };
            reader.onerror = () => reject(new Error('Error al leer archivo'));
            reader.readAsDataURL(file);
          });
        };

        // Si Storage falla se guarda la foto como base64 DENTRO del documento de
        // Firestore, que tiene un limite duro de 1 MB. Antes no se controlaba: con una
        // foto grande el guardado fallaba (o inflaba el documento y con el la descarga
        // de TODOS los clientes). Aca se recomprime hasta entrar en el limite.
        const comprimirHastaLimite = async (file, limite = MAX_BASE64_BYTES) => {
          let ancho = 1280, calidad = 0.72;
          for (let intento = 0; intento < 5; intento++) {
            const comprimida = await comprimirFoto(file, ancho, calidad);
            const b64 = await fileToBase64(comprimida);
            if (b64.length <= limite) return b64;
            ancho = Math.round(ancho * 0.75);
            calidad = Math.max(0.35, calidad - 0.12);
          }
          return null;
        };

        // ========================================
        // SUBIR FOTO: intenta Storage, si falla → base64
        // ========================================
        const subirFoto = (file, carpeta = 'reportes') => {
          return new Promise((resolve) => {
            // Intentar subir a Storage con timeout de 10s
            const timeout = setTimeout(() => {
              console.warn('⚠️ Storage timeout, cayendo a base64');
              resolve(null); // señal para usar base64
            }, 10000);

            const storageRef = storage.ref(`${carpeta}/${Date.now()}_${file.name}`);
            storageRef.put(file).then(async () => {
              clearTimeout(timeout);
              const url = await storageRef.getDownloadURL();
              console.log('✅ Foto subida a Storage');
              resolve(url);
            }).catch((err) => {
              clearTimeout(timeout);
              console.warn('⚠️ Storage falló, cayendo a base64:', err.message);
              resolve(null);
            });
          });
        };

        // Convierte un File a string base64
        const fileToBase64 = (file) => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
        };
        // ========================================
        const LIMPIEZA_KEY = 'ferni_ultima_limpieza';
        const limpiarFotosViejas = async () => {
          try {
            // Antes se recorria la coleccion entera cada vez que entraba un admin.
            // Ahora, como maximo una vez cada 24 h por dispositivo.
            const ultima = Number(localStorage.getItem(LIMPIEZA_KEY) || 0);
            if (Date.now() - ultima < LIMPIEZA_MIN_MS) return;
            localStorage.setItem(LIMPIEZA_KEY, String(Date.now()));
            console.log('🧹 Iniciando limpieza de fotos antiguas...');
            const fechaLimite = new Date();
            fechaLimite.setDate(fechaLimite.getDate() - DIAS_RETENCION);

            // Solo where por estado, sin orderBy → no necesita índice compuesto
            const snapshot = await db.collection('reportes')
              .where('estado', '==', 'resuelto')
              .get();

            let fotosEliminadas = 0;

            for (const doc of snapshot.docs) {
              const reporte = doc.data();
              const fecha = getFecha(reporte.fecha_creacion);
              if (!fecha || fecha >= fechaLimite) continue;
              if (!reporte.foto_problema && !reporte.foto_solucion) continue;

              // Si es URL de Storage, intentar borrar del storage
              if (reporte.foto_problema && reporte.foto_problema.startsWith('http')) {
                try { await storage.refFromURL(reporte.foto_problema).delete(); } catch(e) {}
              }
              if (reporte.foto_solucion && reporte.foto_solucion.startsWith('http')) {
                try { await storage.refFromURL(reporte.foto_solucion).delete(); } catch(e) {}
              }

              await doc.ref.update({ foto_problema: null, foto_solucion: null });
              fotosEliminadas++;
            }

            console.log(`✅ Limpieza completada: ${fotosEliminadas} fotos eliminadas, 0 errores`);
          } catch (error) {
            console.error('❌ Error en limpieza automática:', error);
          }
        };

        // ========================================
        // COMPONENTE PRINCIPAL
        // ========================================
        const SESSION_KEY = 'ferni_session';
        const SESSION_VERSION = 2;

        const guardarSesion = (datos) => {
          try {
            localStorage.setItem(SESSION_KEY, JSON.stringify(Object.assign({}, datos, {
              v: SESSION_VERSION,
              creadaEn: Date.now(),
              expiraEn: Date.now() + SESSION_TTL_MS
            })));
          } catch (e) {
            console.warn('No se pudo guardar la sesion local:', e);
          }
        };

        // IMPORTANTE: el localStorage lo edita cualquiera desde las devtools.
        // Por eso al cargar se descartan los flags de privilegio: esAdmin/esGerente
        // vuelven a otorgarse solo despues de revalidar contra Firebase Auth
        // (ver el useEffect "revalidacion de permisos" en FerniApp).
        const cargarSesion = () => {
          try {
            const raw = localStorage.getItem(SESSION_KEY);
            if (!raw) return null;
            const s = JSON.parse(raw);
            if (!s || s.v !== SESSION_VERSION) { localStorage.removeItem(SESSION_KEY); return null; }
            if (!s.expiraEn || Date.now() > s.expiraEn) { localStorage.removeItem(SESSION_KEY); return null; }
            return Object.assign({}, s, { esAdmin: false, esGerente: false });
          } catch { return null; }
        };

        const borrarSesion = () => {
          try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
        };

        // ========================================
        // HELPERS MÓDULO HORARIOS
        // ========================================

        // Genera un código de invitación único
        // Antes: Math.random().toString(36).substring(2,6) => 4 caracteres, predecible
        // y adivinable por fuerza bruta. Ahora: 8 caracteres de un CSPRNG.
        const generarCodigoInvitacion = (sucursalId, areaId) => {
          const sigArea = areaId.substring(0, 3).toUpperCase();
          return `${sucursalId}-${sigArea}-${tokenSeguro(8)}`;
        };

        // Genera franjas de 30 min entre apertura y cierre
        const generarFranjasHorarias = (apertura, cierre) => {
          const [hA, mA] = apertura.split(':').map(Number);
          const [hC, mC] = cierre.split(':').map(Number);
          const inicio = hA * 60 + mA;
          const fin = hC * 60 + mC;
          const franjas = [];
          for (let m = inicio; m < fin; m += 30) {
            const h = Math.floor(m / 60) % 24;
            const min = m % 60;
            franjas.push(`${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`);
          }
          return franjas;
        };

        // Determina si un colaborador está activo en una franja
        const colaboradorActivoEn = (turno, franja) => {
          if (!turno || turno.franco || turno.vacaciones) return false;
          if (!turno.entrada || !turno.salida) return false;
          return franja >= turno.entrada && franja < turno.salida;
        };

        // Iniciales de un nombre
        const obtenerIniciales = (nombre) => {
          if (!nombre) return '?';
          return nombre.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
        };

        // ID de semana ISO-8601 real (formato 2026-W18).
        // La version anterior dependia del dia de la semana del 1 de enero y se
        // desfasaba una semana en los cambios de anio.
        const obtenerSemanaActual = (base) => {
          const d = new Date(base || Date.now());
          d.setHours(0, 0, 0, 0);
          // Jueves de la semana ISO a la que pertenece la fecha
          d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
          const anio = d.getFullYear();
          const primerJueves = new Date(anio, 0, 4);
          primerJueves.setHours(0, 0, 0, 0);
          primerJueves.setDate(primerJueves.getDate() + 3 - ((primerJueves.getDay() + 6) % 7));
          const semana = 1 + Math.round((d - primerJueves) / (7 * 24 * 60 * 60 * 1000));
          return `${anio}-W${String(semana).padStart(2, '0')}`;
        };

        // ========================================

        const AppCtx = React.createContext(null);
        const useApp = () => React.useContext(AppCtx);

                setInvitacionValida({ codigo, ...inv });

            };

            const handleCrearCuentaLider = async () => {

              try {
                // Marcar invitación como usada
                await db.collection('horarios_invitaciones').doc(invitacionValida.codigo).update({
                  usada: true,
                  usadaPor: nombreLider.trim(),
                  usadaEn: firebase.firestore.FieldValue.serverTimestamp()
                });
                // Crear sesión líder
                const sesion = {
                  usuario: nombreLider.trim(),
                  usuarioEmail: `lider_${invitacionValida.area}_${invitacionValida.sucursal}`.toLowerCase(),
                  sucursalUsuario: invitacionValida.sucursal,

                setEsGerente(false);
                setEsLider(true);
                setAreaLider(sesion.areaLider);

              } catch (err) {

                setErrorCodigo('Error al crear la cuenta. Reintentá.');

            };


            const [codigoVto, setCodigoVto] = useState('');
            const [nombreVto, setNombreVto] = useState('');
            const [errorVto, setErrorVto] = useState('');
            const [cargandoVtoLogin, setCargandoVtoLogin] = useState(false);

            const handleLoginEncargadoVto = async () => {
              setErrorVto('');

              setCargandoVtoLogin(true);
              await asegurarAuth();
              try {

                if (expiraEn && Date.now() > expiraEn.getTime()) { setErrorVto('Este código expiró. Pedí uno nuevo.'); return; }
                // Registrar uso sin bloquear (permite múltiples encargados)
                await db.collection('vencimientos_invitaciones').doc(codigo).update({
                  usos: firebase.firestore.FieldValue.arrayUnion({ nombre: nombreVto.trim(), fecha: new Date().toISOString() })
                });
                const sesion = {

                guardarSesion(sesion);

                setEsAdmin(false); setEsGerente(false); setEsLider(false);

                setRubroVto(sesion.rubroVto);
                setVista('vencimientos');
              } catch(err) {
                setErrorVto('Error al validar el código. Revisá tu conexión.');
                console.error(err);
              } finally {
                setCargandoVtoLogin(false);

            };

            return (
              <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                <div className="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">

                  <div className="flex gap-2 mb-6 flex-wrap">

                    <button onClick={() => setTipoLogin('admin')} className={`flex-1 py-3 rounded-lg font-semibold transition text-sm ${tipoLogin === 'admin' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>Admin</button>
                    <button onClick={() => setTipoLogin('codigo')} className={`flex-1 py-3 rounded-lg font-semibold transition text-sm ${tipoLogin === 'codigo' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>Código</button>
                    <button onClick={() => setTipoLogin('vencimientos')} className={`flex-1 py-3 rounded-lg font-semibold transition text-sm ${tipoLogin === 'vencimientos' ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>Vencimientos</button>
                  </div>

                        <input type="text" placeholder="Nombre y Apellido" value={nombre} onChange={(e) => setNombre(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none" />

                  {tipoLogin === 'vencimientos' && (

                      </div>

                        <label className="block text-sm font-medium text-gray-700 mb-2">Tu nombre</label>
                        <input type="text" placeholder="Nombre y Apellido" value={nombreVto}
                          onChange={(e) => setNombreVto(e.target.value)}
                          className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-400 focus:outline-none" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">Código de encargado</label>
                        <input type="text" placeholder="VTO-F3-XXXX" value={codigoVto}
                          onChange={(e) => setCodigoVto(e.target.value.toUpperCase())}
                          onKeyPress={(e) => e.key === 'Enter' && handleLoginEncargadoVto()}
                          className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-orange-400 focus:outline-none text-center text-lg font-mono tracking-widest font-bold" />
                      </div>
                      {errorVto && <div className="text-red-600 text-sm text-center">{errorVto}</div>}
                      <button onClick={handleLoginEncargadoVto} disabled={cargandoVtoLogin} className="w-full bg-orange-500 text-white py-3 rounded-lg font-semibold hover:bg-orange-600 transition disabled:opacity-60">
                        {cargandoVtoLogin ? 'Validando...' : 'Ingresar como Encargado'}
                      </button>
                    </div>
                  )}
                </div>
              </div>
            );
          };
          const VistaLista = () => {
            const { vista, setVista, usuario, sucursalActiva, esAdmin, reportes, reportesNuevos, contadorNuevos, setContadorNuevos, filtroEstado, setFiltroEstado, setReporteActual, cerrarSesionTotal } = useApp();
            const reportesFiltrados = reportes.filter(r => filtroEstado === 'todos' || r.estado === filtroEstado);
            const sucursalNombre = SUCURSAL_NOMBRE;

            const tiempoTranscurrido = (campo) => {
              const fecha = getFecha(campo);
              if (!fecha) return null;
              const diff = Date.now() - fecha.getTime();
              const horas = Math.floor(diff / (1000 * 60 * 60));
              const dias = Math.floor(horas / 24);
              if (dias >= 1) return { texto: `hace ${dias}d`, color: dias >= 3 ? 'text-red-600 font-bold' : dias >= 1 ? 'text-orange-500 font-semibold' : 'text-gray-400' };
              return { texto: `hace ${horas}h`, color: horas >= 12 ? 'text-orange-500 font-semibold' : 'text-gray-400' };
            };

            // Marcar como visto al interactuar
            const marcarVisto = () => {
              const ultimaVisitaKey = `ultimaVisita_${sucursalActiva}`;
              localStorage.setItem(ultimaVisitaKey, new Date().toISOString());
              setContadorNuevos(0);
            };

            // Auto-marcar después de 3 segundos si hay nuevos
            useEffect(() => {
              if (contadorNuevos > 0) {
                const timer = setTimeout(marcarVisto, 3000);
                return () => clearTimeout(timer);
              }
            }, [contadorNuevos]);

            return (
              <div className="min-h-screen bg-gray-50">
                {/* Header compacto */}
                <div style={{ background: '#1E3A5F', color: 'white', padding: '16px 20px 12px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                    <div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <h1 style={{ fontSize: 20, fontWeight: 700, margin: 0 }}>FERNI 3</h1>
                        {contadorNuevos > 0 && (
                          <span style={{ background: '#FF4D4D', color: 'white', fontSize: 11, fontWeight: 700, padding: '2px 8px', borderRadius: 20 }} className="animate-pulse">
                            {contadorNuevos} nuevo{contadorNuevos > 1 ? 's' : ''}
                          </span>
                        )}
                      </div>
                      <div style={{ fontSize: 13, opacity: 0.7, marginTop: 2 }}>Hola, {usuario} {esAdmin && '👑'}</div>
                    </div>
                    <button onClick={cerrarSesionTotal} style={{ fontSize: 12, opacity: 0.6, background: 'none', border: 'none', color: 'white', cursor: 'pointer' }}>Salir</button>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 10, marginTop: 14 }}>
                    {[
                      { label: 'Total', val: reportes.length },
                      { label: 'Abiertos', val: reportes.filter(r => r.estado === 'abierto').length },
                      { label: 'Resueltos', val: reportes.filter(r => r.estado === 'resuelto').length }
                    ].map(k => (
                      <div key={k.label} style={{ background: 'rgba(255,255,255,0.1)', borderRadius: 10, padding: '10px 8px', textAlign: 'center' }}>
                        <div style={{ fontSize: 22, fontWeight: 700 }}>{k.val}</div>
                        <div style={{ fontSize: 11, opacity: 0.7 }}>{k.label}</div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Filtros */}
                <div style={{ display: 'flex', gap: 8, padding: '12px 16px', background: '#1A1A1A', overflowX: 'auto', borderBottom: '1px solid #2A2A2A' }}>
                  {['todos', 'abierto', 'resuelto'].map(estado => (
                    <button key={estado} onClick={() => setFiltroEstado(estado)}
                      style={{ padding: '7px 16px', borderRadius: 20, fontWeight: 600, whiteSpace: 'nowrap', fontSize: 13, border: 'none', cursor: 'pointer',
                        background: filtroEstado === estado ? '#4ECDC4' : '#2A2A2A',
                        color: filtroEstado === estado ? '#0F0F0F' : '#aaa' }}>
                      {estado === 'todos' ? 'Todos' : estado === 'abierto' ? 'Abiertos' : 'Resueltos'}
                    </button>
                  ))}
                </div>

                <div className="p-4 space-y-3 pb-24">
                  {reportesFiltrados.length === 0 ? (
                    <div className="text-center py-12 text-gray-400">
                      <div className="text-6xl mb-4">📭</div>
                      <p>No hay reportes</p>
                    </div>
                  ) : (
                    reportesFiltrados.map(reporte => {
                      const categoria = CATEGORIAS.find(c => c.id === reporte.categoria);
                      const sucursal = SUCURSALES.find(s => s.id === reporte.sucursal);
                      const esNuevo = reportesNuevos.includes(reporte.id);
                      const tiempo = reporte.estado === 'abierto' ? tiempoTranscurrido(reporte.fecha_creacion) : null;
                      return (
                        <div 
                          key={reporte.id} 
                          onClick={() => { setReporteActual(reporte); setVista('detalle'); marcarVisto(); }} 
                          className={`bg-white rounded-lg p-4 shadow hover:shadow-md transition cursor-pointer ${esNuevo ? 'ring-2 ring-green-400 animate-pulse' : ''}`} 
                          style={{ borderLeft: `4px solid ${categoria?.color}` }}
                        >
                          <div className="flex justify-between items-start mb-2">
                            <div className="flex items-center gap-2 flex-1">
                              {esNuevo && <span className="text-green-500 text-xl">✨</span>}
                              <span className="text-2xl">{categoria?.icon}</span>
                              <div className="flex-1">
                                <div className="font-semibold" style={{ color: '#F0EDE8' }}>{categoria?.nombre}</div>
                                <div className="text-sm" style={{ color: '#888888' }}>
                                  Por {reporte.usuario_reporta}

                                </div>
                              </div>
                            </div>
                            <span className={`px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap ${reporte.estado === 'abierto' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                              {reporte.estado === 'abierto' ? '🔴 Abierto' : '✅ Resuelto'}
                            </span>
                          </div>
                          <p className="text-sm mb-2 line-clamp-2" style={{ color: '#AAAAAA' }}>{reporte.descripcion}</p>
                          <div className="flex justify-between items-center">
                            <div className="text-xs" style={{ color: '#666660' }}>{formatFecha(reporte.fecha_creacion)}</div>
                            {tiempo && <div className={`text-xs ${tiempo.color}`}>⏱ {tiempo.texto}</div>}
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

                <button onClick={() => setVista('crear')} className="fixed bottom-20 right-5 bg-blue-600 text-white w-14 h-14 rounded-2xl shadow-lg hover:bg-blue-700 transition flex items-center justify-center text-2xl">+</button>
              </div>
            );
          };

          // ========================================
          // CREAR REPORTE
          // ========================================
          const VistaCrear = () => {
            const { setVista, usuario, usuarioEmail, cargando, setCargando } = useApp();
            const [categoria, setCategoria] = useState('');
            const [descripcion, setDescripcion] = useState('');
            const [foto, setFoto] = useState(null);
            const [previsualizacion, setPrevisualizacion] = useState(null);

            const handleFotoChange = async (e) => {
              const file = e.target.files[0];
              if (!file) return;
              const problema = validarArchivoImagen(file);
              if (problema) { alert(problema); e.target.value = ''; return; }
              try {
                const fotoComprimida = await comprimirFoto(file);
                setFoto(fotoComprimida);
                const reader = new FileReader();
                reader.onload = (ev) => setPrevisualizacion(ev.target.result);
                reader.readAsDataURL(fotoComprimida);
              } catch (error) {
                console.error('Error al comprimir foto:', error);
                alert('Error al procesar la foto');
              }
            };

            const handleCrear = async () => {
              const desc = limpiarTexto(descripcion, MAX_DESCRIPCION).trim();
              if (!categoria || !desc || !foto) { alert('Completá todos los campos'); return; }
              if (!CATEGORIAS.some(c => c.id === categoria)) { alert('Categoría inválida'); return; }
              setCargando(true);
              try {
                // Intentar Storage; si falla, usar base64 acotado al límite del documento
                let fotoGuardar = await subirFoto(foto, 'reportes');
                if (!fotoGuardar) {
                  console.log('📦 Guardando foto como base64...');
                  fotoGuardar = await comprimirHastaLimite(foto);
                  if (!fotoGuardar) {
                    alert('No se pudo guardar la foto: es demasiado pesada y Storage no está disponible. Probá con otra foto o revisá tu conexión.');
                    return;
                  }
                }

                await db.collection('reportes').add({
                  categoria,
                  descripcion: desc,
                  foto_problema: fotoGuardar,
                  foto_solucion: null,
                  usuario_reporta: usuario,
                  usuario_reporta_email: usuarioEmail,
                  usuario_resuelve: null,
                  usuario_resuelve_email: null,
                  estado: 'abierto',
                  fecha_creacion: new Date(),
                  fecha_resolucion: null,
                  analisis_ia: null,
                  sucursal: SUCURSAL_ID,
                  comentarios: []
                });

                alert('✅ Reporte creado exitosamente');
                setVista('lista');
              } catch (error) {
                console.error('❌ Error al crear reporte:', error);
                alert('Error al crear reporte: ' + error.message);
              } finally {
                setCargando(false);
              }
            };

            const sucursalCrear = SUCURSAL_ID;

            return (
              <div className="min-h-screen bg-gray-50">
                <div className="bg-blue-600 text-white p-6">
                  <button onClick={() => setVista('lista')} className="mb-4 text-blue-100 hover:text-white">← Volver</button>
                  <h1 className="text-2xl font-bold">Nuevo Reporte</h1>
                  <p className="text-blue-100 text-sm mt-1">FERNI 3</p>
                </div>

                <div className="p-6 space-y-6">
                  <div>
                    <label className="block font-semibold mb-3" style={{ color: '#F0EDE8' }}>Categoría</label>
                    <div className="grid grid-cols-1 gap-3">
                      {CATEGORIAS.map(cat => (
                        <button key={cat.id} onClick={() => setCategoria(cat.id)}
                          className={`p-4 rounded-lg border-2 transition text-left`}
                          style={{
                            background: categoria === cat.id ? '#2A2A2A' : '#1A1A1A',
                            borderColor: categoria === cat.id ? '#4ECDC4' : '#3A3A3A'
                          }}>
                          <div className="flex items-center gap-3">
                            <span className="text-2xl">{cat.icon}</span>
                            <span className="font-medium" style={{ color: '#F0EDE8' }}>{cat.nombre}</span>
                          </div>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold mb-2" style={{ color: '#F0EDE8' }}>Descripción</label>
                    <textarea value={descripcion} maxLength={MAX_DESCRIPCION} onChange={(e) => setDescripcion(e.target.value)} placeholder="Describí el problema..." className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none" rows="4" />
                    <div className="text-right text-xs mt-1" style={{ color: '#666660' }}>{descripcion.length}/{MAX_DESCRIPCION}</div>
                  </div>

                  <div>
                    <label className="block font-semibold mb-2" style={{ color: '#F0EDE8' }}>Foto del problema</label>
                    <input type="file" accept="image/*" onChange={handleFotoChange} className="hidden" id="foto-input" />
                    <label htmlFor="foto-input" className="block w-full p-6 border-2 border-dashed border-gray-300 rounded-lg text-center cursor-pointer hover:border-blue-500 transition">
                      {previsualizacion ? (
                        <img src={previsualizacion} alt="Preview" className="max-h-48 mx-auto rounded" />
                      ) : (
                        <>
                          <div className="text-4xl mb-2">📷</div>
                          <div style={{ color: '#AAAAAA' }}>Tocar para tomar foto</div>
                        </>
                      )}
                    </label>
                  </div>

                  <button onClick={handleCrear} disabled={cargando || !categoria || !descripcion || !foto} className="w-full bg-blue-600 text-white py-4 rounded-lg font-semibold hover:bg-blue-700 transition disabled:bg-gray-300 disabled:cursor-not-allowed">
                    {cargando ? 'Creando...' : '✅ Crear Reporte'}
                  </button>
                </div>
              </div>
            );
          };

          // ========================================
          // DETALLE DE REPORTE
          // ========================================
          const VistaDetalle = () => {
            const { setVista, usuario, usuarioEmail, cargando, setCargando, esAdmin, esGerente, reporteActual } = useApp();
            // Los hooks van SIEMPRE antes de cualquier return condicional: si no,
            // React cambia el orden de hooks entre renders y rompe el componente.
            const [fotoSolucion, setFotoSolucion] = useState(null);
            const [previsualizacionSolucion, setPrevisualizacionSolucion] = useState(null);
            const [nuevoComentario, setNuevoComentario] = useState('');

            if (!reporteActual) return null;

            const categoria = CATEGORIAS.find(c => c.id === reporteActual.categoria);
            const sucursal = SUCURSALES.find(s => s.id === reporteActual.sucursal);

            const handleFotoSolucionChange = async (e) => {
              const file = e.target.files[0];
              if (!file) return;
              const problema = validarArchivoImagen(file);
              if (problema) { alert(problema); e.target.value = ''; return; }
              try {
                const fotoComprimida = await comprimirFoto(file);
                setFotoSolucion(fotoComprimida);
                const reader = new FileReader();
                reader.onload = (ev) => setPrevisualizacionSolucion(ev.target.result);
                reader.readAsDataURL(fotoComprimida);
              } catch (error) {
                console.error('Error al comprimir foto:', error);
                alert('Error al procesar la foto');
              }
            };

            const handleResolver = async () => {
              if (!fotoSolucion) { alert('Tomá una foto de la solución'); return; }
              setCargando(true);
              try {
                // Intentar Storage; si falla, usar base64
                let fotoGuardar = await subirFoto(fotoSolucion, 'soluciones');
                if (!fotoGuardar) {
                  console.log('📦 Guardando foto solución como base64...');
                  fotoGuardar = await comprimirHastaLimite(fotoSolucion);
                  if (!fotoGuardar) {
                    alert('No se pudo guardar la foto: es demasiado pesada y Storage no está disponible.');
                    return;
                  }
                }

                await db.collection('reportes').doc(reporteActual.id).update({
                  estado: 'resuelto',
                  foto_solucion: fotoGuardar,
                  usuario_resuelve: usuario,
                  usuario_resuelve_email: usuarioEmail,
                  fecha_resolucion: new Date()
                });

                alert('✅ Reporte resuelto exitosamente');
                setVista('lista');
              } catch (error) {
                console.error('❌ Error al resolver reporte:', error);
                alert('Error al resolver: ' + error.message);
              } finally {
                setCargando(false);
              }
            };

            const handleEliminar = async () => {
              if (!esAdmin) { alert('Solo administradores pueden eliminar reportes'); return; }
              if (!confirm('¿Estás seguro de eliminar este reporte?')) return;
              try {
                // Borrar fotos de Storage si son URLs
                if (reporteActual.foto_problema && reporteActual.foto_problema.startsWith('http')) {
                  try { await storage.refFromURL(reporteActual.foto_problema).delete(); } catch(e) {}
                }
                if (reporteActual.foto_solucion && reporteActual.foto_solucion.startsWith('http')) {
                  try { await storage.refFromURL(reporteActual.foto_solucion).delete(); } catch(e) {}
                }
                await db.collection('reportes').doc(reporteActual.id).delete();
                alert('✅ Reporte eliminado');
                setVista('lista');
              } catch (error) {
                console.error('Error al eliminar:', error);
                alert('Error al eliminar reporte');
              }
            };

            const handleAgregarComentario = async () => {
              const texto = limpiarTexto(nuevoComentario, MAX_COMENTARIO).trim();
              if (!texto) return;
              try {
                // arrayUnion en vez de leer-y-reescribir el array completo: si dos
                // personas comentan al mismo tiempo, antes uno de los comentarios
                // se perdia silenciosamente.
                await db.collection('reportes').doc(reporteActual.id).update({
                  comentarios: firebase.firestore.FieldValue.arrayUnion({
                    usuario: usuario,
                    usuario_email: usuarioEmail || null,
                    texto: texto,
                    fecha: new Date()
                  })
                });
                setNuevoComentario('');
              } catch (error) {
                console.error('Error al agregar comentario:', error);
                alert('Error al agregar comentario');
              }
            };

            return (
              <div className="min-h-screen bg-gray-50">
                <div className="bg-blue-600 text-white p-6">
                  <button onClick={() => setVista('lista')} className="mb-4 text-blue-100 hover:text-white">← Volver</button>
                  <h1 className="text-2xl font-bold">Detalle del Reporte</h1>
                  {sucursal && <p className="text-blue-100 text-sm mt-1">📍 {sucursal.nombre}</p>}
                </div>

                <div className="p-6 space-y-6">
                  {/* Info principal */}
                  <div className="bg-white rounded-lg p-6 shadow">
                    <div className="flex items-center gap-3 mb-4">
                      <span className="text-3xl">{categoria?.icon}</span>
                      <div>
                        <div className="font-bold text-xl" style={{ color: categoria?.color }}>{categoria?.nombre}</div>
                        <div className="text-sm text-gray-500">Reportado por {reporteActual.usuario_reporta}</div>
                      </div>
                    </div>

                    <div className={`inline-block px-4 py-2 rounded-full font-medium mb-4 ${reporteActual.estado === 'abierto' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                      {reporteActual.estado === 'abierto' ? '🔴 Abierto' : '✅ Resuelto'}
                    </div>

                    <p className="text-gray-700 mb-4">{reporteActual.descripcion}</p>
                    <div className="text-sm text-gray-500">Creado: {formatFecha(reporteActual.fecha_creacion)}</div>
                  </div>

                  {/* Botón compartir por WhatsApp */}
                  <div className="bg-white rounded-lg p-4 shadow">
                    <button
                      onClick={() => {
                        const link = `${window.location.origin}${window.location.pathname}#reporte-${reporteActual.id}`;
                        const estado = reporteActual.estado === 'abierto' ? '🔴 ABIERTO' : '✅ RESUELTO';
                        const sucursalNombre = SUCURSAL_NOMBRE;
                        const catNombre = CATEGORIAS.find(c => c.id === reporteActual.categoria);
                        const texto = `${estado} — ${catNombre?.icon || ''} ${catNombre?.nombre || reporteActual.categoria}\n📍 ${sucursalNombre}\n👤 Reportado por: ${reporteActual.usuario_reporta}\n📝 ${reporteActual.descripcion}\n🕐 ${formatFecha(reporteActual.fecha_creacion)}\n\n🔗 Ver reporte: ${link}`;
                        abrirExterno(`https://wa.me/?text=${encodeURIComponent(texto)}`);
                      }}
                      className="w-full flex items-center justify-center gap-3 py-3 rounded-lg font-semibold"
                      style={{ backgroundColor: '#25D366', color: '#fff' }}
                    >
                      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                      Compartir por WhatsApp
                    </button>
                  </div>

                  {/* Foto del problema */}
                  <div className="bg-white rounded-lg p-6 shadow">
                    <h3 className="font-bold text-gray-800 mb-3">📷 Foto del Problema</h3>
                    {reporteActual.foto_problema ? (
                      <img src={reporteActual.foto_problema} alt="Problema" className="w-full rounded-lg" />
                    ) : (
                      <div className="text-gray-400 text-center py-8 bg-gray-50 rounded-lg">
                        <div className="text-3xl mb-2">🗑️</div>
                        Foto eliminada por política de retención ({DIAS_RETENCION} días)
                      </div>
                    )}
                  </div>

                  {/* Foto de la solución (si está resuelto) */}
                  {reporteActual.estado === 'resuelto' && (
                    <div className="bg-white rounded-lg p-6 shadow">
                      <h3 className="font-bold text-gray-800 mb-3">✅ Foto de la Solución</h3>
                      {reporteActual.foto_solucion ? (
                        <>
                          <img src={reporteActual.foto_solucion} alt="Solución" className="w-full rounded-lg mb-3" />
                          <div className="text-sm text-gray-500">
                            Resuelto por {reporteActual.usuario_resuelve}<br />
                            {formatFecha(reporteActual.fecha_resolucion)}
                          </div>
                        </>
                      ) : (
                        <div className="text-gray-400 text-center py-8 bg-gray-50 rounded-lg">
                          <div className="text-3xl mb-2">🗑️</div>
                          Foto eliminada por política de retención ({DIAS_RETENCION} días)
                        </div>
                      )}
                    </div>
                  )}

                  {/* Resolver (si está abierto) */}
                  {reporteActual.estado === 'abierto' && (
                    <div className="bg-white rounded-lg p-6 shadow">
                      <h3 className="font-bold text-gray-800 mb-3">Marcar como Resuelto</h3>
                      <input type="file" accept="image/*" onChange={handleFotoSolucionChange} className="hidden" id="foto-solucion-input" />
                      <label htmlFor="foto-solucion-input" className="block w-full p-6 border-2 border-dashed border-gray-300 rounded-lg text-center cursor-pointer hover:border-green-500 transition mb-4">
                        {previsualizacionSolucion ? (
                          <img src={previsualizacionSolucion} alt="Preview" className="max-h-48 mx-auto rounded" />
                        ) : (
                          <>
                            <div className="text-4xl mb-2">📷</div>
                            <div className="text-gray-600">Tocar para tomar foto de la solución</div>
                          </>
                        )}
                      </label>
                      <button onClick={handleResolver} disabled={cargando || !fotoSolucion} className="w-full bg-green-600 text-white py-4 rounded-lg font-semibold hover:bg-green-700 transition disabled:bg-gray-300">
                        {cargando ? 'Resolviendo...' : '✅ Marcar como Resuelto'}
                      </button>
                    </div>
                  )}

                  {/* Sección de Comentarios */}
                  <div className="bg-white rounded-lg p-6 shadow">
                    <h3 className="font-bold text-gray-800 mb-4">💬 Comentarios y Actualizaciones</h3>
                    
                    {/* Lista de comentarios */}
                    <div className="space-y-3 mb-4">
                      {reporteActual.comentarios && reporteActual.comentarios.length > 0 ? (
                        reporteActual.comentarios.map((comentario, index) => {
                          const fecha = getFecha(comentario.fecha);
                          return (
                            <div key={index} className="bg-gray-50 p-3 rounded-lg">
                              <div className="flex items-center justify-between mb-1">
                                <span className="font-medium text-sm text-gray-900">{comentario.usuario}</span>
                                <span className="text-xs text-gray-500">
                                  {fecha && formatFecha(comentario.fecha)}
                                </span>
                              </div>
                              <p className="text-sm text-gray-700">{comentario.texto}</p>
                            </div>
                          );
                        })
                      ) : (
                        <p className="text-sm text-gray-500 italic">No hay comentarios aún</p>
                      )}
                    </div>
                    
                    {/* Agregar nuevo comentario */}
                    <div className="flex gap-2">
                      <input
                        type="text"
                        value={nuevoComentario}
                        onChange={(e) => setNuevoComentario(e.target.value)}
                        onKeyPress={(e) => {
                          if (e.key === 'Enter' && nuevoComentario.trim()) {
                            handleAgregarComentario();
                          }
                        }}
                        placeholder="Agregar actualización..."
                        className="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                      <button
                        onClick={handleAgregarComentario}
                        disabled={!nuevoComentario.trim()}
                        className="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white px-4 py-2 rounded-lg font-medium transition"
                      >
                        Enviar
                      </button>
                    </div>
                  </div>

                  {/* Eliminar (admin o gerente) */}
                  {(esAdmin || esGerente) && (
                    <button onClick={handleEliminar} className="w-full bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700 transition">🗑️ Eliminar Reporte</button>
                  )}
                </div>
              </div>
            );
          };

          // ========================================
          // DASHBOARD
          // ========================================
          // Panel de Analisis Inteligente (extraido de una IIFE con hooks adentro)
          const PanelAnalisis = ({ reportesFiltrados, getTextoPeriodo }) => {
                    const generarAnalisis = () => {
                      if (reportesFiltrados.length === 0) return null;

                      const totalR = reportesFiltrados.length;
                      const abiertosR = reportesFiltrados.filter(r => r.estado === 'abierto');
                      const resueltosR = reportesFiltrados.filter(r => r.estado === 'resuelto');
                      const tasaRes = totalR > 0 ? Math.round((resueltosR.length / totalR) * 100) : 0;

                      const catAbiertos = {};
                      abiertosR.forEach(r => { catAbiertos[r.categoria] = (catAbiertos[r.categoria] || 0) + 1; });
                      const catCriticaId = Object.entries(catAbiertos).sort((a, b) => b[1] - a[1])[0];
                      const catCritica = catCriticaId ? CATEGORIAS.find(c => c.id === catCriticaId[0]) : null;

                      const catTasas = CATEGORIAS.map(cat => {
                        const rep = reportesFiltrados.filter(r => r.categoria === cat.id);
                        const res = rep.filter(r => r.estado === 'resuelto').length;
                        return { ...cat, total: rep.length, resueltos: res, tasa: rep.length > 0 ? Math.round((res / rep.length) * 100) : 100 };
                      }).filter(c => c.total >= 2).sort((a, b) => a.tasa - b.tasa);
                      const peorCategoria = catTasas.length > 0 ? catTasas[0] : null;

                      const tiempos = resueltosR.map(r => {
                        const fc = getFecha(r.fecha_creacion);
                        const fr = getFecha(r.fecha_resolucion);
                        if (fc && fr) return (fr - fc) / (1000 * 60 * 60);
                        return null;
                      }).filter(t => t !== null && t >= 0);
                      const tiempoPromedio = tiempos.length > 0 ? Math.round(tiempos.reduce((a, b) => a + b, 0) / tiempos.length) : null;

                      const resolvedoresCount = {};
                      resueltosR.forEach(r => {
                        const key = r.usuario_resuelve_email || r.usuario_resuelve;
                        const name = r.usuario_resuelve;
                        if (key && name) {
                          if (!resolvedoresCount[key]) resolvedoresCount[key] = { nombre: name, count: 0 };
                          resolvedoresCount[key].count++;
                        }
                      });
                      const topResolvedor = Object.values(resolvedoresCount).sort((a, b) => b.count - a.count)[0];

                      const mitad = Math.floor(reportesFiltrados.length / 2);
                      const primeraM = reportesFiltrados.slice(mitad);
                      const segundaM = reportesFiltrados.slice(0, mitad);
                      const tasaPrimera = primeraM.length > 0 ? primeraM.filter(r => r.estado === 'resuelto').length / primeraM.length : 0;
                      const tasaSegunda = segundaM.length > 0 ? segundaM.filter(r => r.estado === 'resuelto').length / segundaM.length : 0;
                      const tendencia = tasaSegunda > tasaPrimera + 0.05 ? 'mejorando' : tasaSegunda < tasaPrimera - 0.05 ? 'empeorando' : 'estable';

                      let sucCritica = null;
                      if (false) { // multi-sucursal desactivado
                        const sucStats = SUCURSALES.map(suc => {
                          const rep = reportesFiltrados.filter(r => r.sucursal === suc.id);
                          const ab = rep.filter(r => r.estado === 'abierto').length;
                          return { ...suc, abiertos: ab, total: rep.length };
                        }).filter(s => s.total > 0).sort((a, b) => b.abiertos - a.abiertos);
                        sucCritica = sucStats.length > 0 && sucStats[0].abiertos > 0 ? sucStats[0] : null;
                      }

                      const recomendaciones = [];

                      if (tasaRes < 60) {
                        recomendaciones.push({ tipo: 'alerta', texto: `La tasa de resolución es del ${tasaRes}%. Objetivo recomendado: 80%+. Considerar asignar responsables fijos por categoría.` });
                      } else if (tasaRes >= 80) {
                        recomendaciones.push({ tipo: 'exito', texto: `Excelente tasa de resolución del ${tasaRes}%. El equipo está respondiendo bien a las incidencias.` });
                      } else {
                        recomendaciones.push({ tipo: 'atencion', texto: `Tasa de resolución del ${tasaRes}%. Hay margen de mejora, el objetivo ideal es superar el 80%.` });
                      }

                      if (catCritica && catCriticaId[1] >= 3) {
                        recomendaciones.push({ tipo: 'alerta', texto: `"${catCritica.icon} ${catCritica.nombre}" tiene ${catCriticaId[1]} incidencias abiertas. Recomendación: priorizar esta categoría esta semana.` });
                      }

                      if (peorCategoria && peorCategoria.tasa < 50) {
                        recomendaciones.push({ tipo: 'atencion', texto: `"${peorCategoria.icon} ${peorCategoria.nombre}" tiene la tasa más baja (${peorCategoria.tasa}%). Revisar si hay bloqueos o falta de recursos.` });
                      }

                      if (tiempoPromedio !== null) {
                        if (tiempoPromedio > 72) {
                          recomendaciones.push({ tipo: 'alerta', texto: `Tiempo promedio de resolución: ${tiempoPromedio}hs (~${Math.round(tiempoPromedio/24)} días). Es alto. Definir SLAs por categoría puede mejorar esto.` });
                        } else if (tiempoPromedio <= 24) {
                          recomendaciones.push({ tipo: 'exito', texto: `Tiempo promedio de resolución: ${tiempoPromedio}hs. Respuesta rápida del equipo.` });
                        } else {
                          recomendaciones.push({ tipo: 'atencion', texto: `Tiempo promedio de resolución: ${tiempoPromedio}hs (~${Math.round(tiempoPromedio/24)} días). Aceptable, pero se puede mejorar.` });
                        }
                      }

                      if (topResolvedor) {
                        recomendaciones.push({ tipo: 'exito', texto: `${topResolvedor.nombre} lidera las resoluciones con ${topResolvedor.count} problemas resueltos. Reconocer su compromiso.` });
                      }

                      if (tendencia === 'mejorando') {
                        recomendaciones.push({ tipo: 'exito', texto: 'Tendencia positiva: la tasa de resolución viene mejorando en el período reciente.' });
                      } else if (tendencia === 'empeorando') {
                        recomendaciones.push({ tipo: 'alerta', texto: 'Tendencia negativa: la tasa de resolución viene bajando. Revisar carga de trabajo y recursos.' });
                      }

                      if (sucCritica && sucCritica.abiertos >= 3) {
                        recomendaciones.push({ tipo: 'atencion', texto: `${sucCritica.nombre} tiene ${sucCritica.abiertos} incidencias abiertas, más que otras sucursales. Requiere atención.` });
                      }

                      if (abiertosR.length === 0 && totalR > 0) {
                        recomendaciones.push({ tipo: 'exito', texto: '¡No hay incidencias abiertas! Todas resueltas. Excelente trabajo del equipo.' });
                      }

                      return recomendaciones;
                    };

                    const [mostrarAnalisis, setMostrarAnalisis] = useState(false);
                    const analisis = mostrarAnalisis ? generarAnalisis() : null;

                    return (
                      <div className="bg-white rounded-lg p-6 shadow">
                        <button 
                          onClick={() => setMostrarAnalisis(!mostrarAnalisis)}
                          className="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-4 rounded-lg font-semibold hover:from-purple-700 hover:to-indigo-700 transition flex items-center justify-center gap-3 text-lg"
                        >
                          <span className="text-2xl">🧠</span>
                          {mostrarAnalisis ? 'Ocultar Análisis' : 'Generar Análisis Inteligente'}
                        </button>
                        
                        {mostrarAnalisis && analisis && analisis.length > 0 && (
                          <div className="mt-6 space-y-3">
                            <h3 className="font-bold text-gray-800 text-lg mb-4">📋 Informe de Situación</h3>
                            {analisis.map((item, idx) => (
                              <div key={idx} className={`p-4 rounded-lg border-l-4 ${
                                item.tipo === 'alerta' ? 'bg-red-50 border-red-500' :
                                item.tipo === 'atencion' ? 'bg-yellow-50 border-yellow-500' :
                                'bg-green-50 border-green-500'
                              }`}>
                                <div className="flex items-start gap-3">
                                  <span className="text-xl mt-0.5">
                                    {item.tipo === 'alerta' ? '🔴' : item.tipo === 'atencion' ? '🟡' : '🟢'}
                                  </span>
                                  <p className={`text-sm font-medium ${
                                    item.tipo === 'alerta' ? 'text-red-800' :
                                    item.tipo === 'atencion' ? 'text-yellow-800' :
                                    'text-green-800'
                                  }`}>{item.texto}</p>
                                </div>
                              </div>
                            ))}
                            <div className="text-xs text-gray-400 mt-4 text-center">
                              Análisis generado sobre {reportesFiltrados.length} reportes • {getTextoPeriodo()}
                            </div>
                          </div>
                        )}
                        
                        {mostrarAnalisis && (!analisis || analisis.length === 0) && (
                          <div className="mt-4 text-center text-gray-500 py-4">
                            No hay suficientes datos para generar análisis en este período.
                          </div>
                        )}
                      </div>
                    );
          };

          const VistaDashboard = () => {
            const { setVista, esAdmin, esGerente, reportes, sucursalActiva } = useApp();
            // Estados para filtro de fechas
            const [filtroFecha, setFiltroFecha] = useState('todo'); // 'todo', 'semana', 'mes', 'mes_anterior', 'personalizado'
            const [fechaDesde, setFechaDesde] = useState('');
            const [fechaHasta, setFechaHasta] = useState('');

            // Funciones auxiliares de fechas
            const hoy = new Date();
            const inicioSemana = new Date(hoy);
            inicioSemana.setDate(hoy.getDate() - hoy.getDay());
            inicioSemana.setHours(0,0,0,0);

            const inicioMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
            const finMes = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0, 23, 59, 59);

            const inicioMesAnterior = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1);
            const finMesAnterior = new Date(hoy.getFullYear(), hoy.getMonth(), 0, 23, 59, 59);

            // Aplicar filtro de fechas
            const reportesFiltrados = reportes.filter(r => {
              if (filtroFecha === 'todo') return true;

              const fechaCreacion = getFecha(r.fecha_creacion);
              if (!fechaCreacion) return false;

              let desde, hasta;
              
              if (filtroFecha === 'semana') {
                desde = inicioSemana;
                hasta = hoy;
              } else if (filtroFecha === 'mes') {
                desde = inicioMes;
                hasta = finMes;
              } else if (filtroFecha === 'mes_anterior') {
                desde = inicioMesAnterior;
                hasta = finMesAnterior;
              } else if (filtroFecha === 'personalizado' && fechaDesde && fechaHasta) {
                desde = new Date(fechaDesde);
                hasta = new Date(fechaHasta);
                hasta.setHours(23, 59, 59);
              } else {
                return true;
              }

              return fechaCreacion >= desde && fechaCreacion <= hasta;
            });

            // Calcular estadísticas con reportes filtrados
            const stats = {
              total: reportesFiltrados.length,
              abiertos: reportesFiltrados.filter(r => r.estado === 'abierto').length,
              resueltos: reportesFiltrados.filter(r => r.estado === 'resuelto').length,
              tasaResolucion: reportesFiltrados.length > 0 ? Math.round((reportesFiltrados.filter(r => r.estado === 'resuelto').length / reportesFiltrados.length) * 100) : 0
            };

            const statsPorSucursal = false && esAdmin && sucursalActiva === 'TODAS'
              ? SUCURSALES.map(suc => {
                  const rep = reportesFiltrados.filter(r => r.sucursal === suc.id);
                  const res = rep.filter(r => r.estado === 'resuelto').length;
                  return { ...suc, total: rep.length, abiertos: rep.filter(r => r.estado === 'abierto').length, resueltos: res, tasaResolucion: rep.length > 0 ? Math.round((res / rep.length) * 100) : 0 };
                }).filter(s => s.total > 0).sort((a, b) => b.total - a.total)
              : null;

            const porCategoria = CATEGORIAS.map(cat => {
              const rep = reportesFiltrados.filter(r => r.categoria === cat.id);
              return { ...cat, total: rep.length, abiertos: rep.filter(r => r.estado === 'abierto').length, resueltos: rep.filter(r => r.estado === 'resuelto').length };
            }).filter(cat => cat.total > 0);

            const usuariosStats = {};
            reportesFiltrados.forEach(r => {
              // Usar email como key para evitar duplicados
              const emailReporta = r.usuario_reporta_email || r.usuario_reporta;
              const nombreReporta = r.usuario_reporta;
              
              if (emailReporta) {
                if (!usuariosStats[emailReporta]) {
                  usuariosStats[emailReporta] = { nombre: nombreReporta, reportados: 0, resueltos: 0 };
                }
                usuariosStats[emailReporta].reportados++;
              }
              
              const emailResuelve = r.usuario_resuelve_email || r.usuario_resuelve;
              const nombreResuelve = r.usuario_resuelve;
              
              if (emailResuelve) {
                if (!usuariosStats[emailResuelve]) {
                  usuariosStats[emailResuelve] = { nombre: nombreResuelve, reportados: 0, resueltos: 0 };
                }
                usuariosStats[emailResuelve].resueltos++;
              }
            });

            const topReportadores = Object.entries(usuariosStats)
              .filter(([email, stats]) => stats.reportados > 0)
              .sort((a, b) => b[1].reportados - a[1].reportados)
              .slice(0, 5);

            const topResolvedores = Object.entries(usuariosStats)
              .filter(([email, stats]) => stats.resueltos > 0)
              .sort((a, b) => b[1].resueltos - a[1].resueltos)
              .slice(0, 5);

            // Texto descriptivo del período
            const getTextoPeriodo = () => {
              if (filtroFecha === 'todo') return 'Todo el período';
              if (filtroFecha === 'semana') return 'Esta semana';
              if (filtroFecha === 'mes') return 'Este mes';
              if (filtroFecha === 'mes_anterior') return 'Mes anterior';
              if (filtroFecha === 'personalizado' && fechaDesde && fechaHasta) {
                return `${new Date(fechaDesde).toLocaleDateString('es-AR')} - ${new Date(fechaHasta).toLocaleDateString('es-AR')}`;
              }
              return 'Seleccioná período';
            };

            return (
              <div className="min-h-screen bg-gray-50 pb-20" id="dashboard-container">
                <div className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-6 no-print">
                  <div className="flex justify-between items-center mb-4">
                    <button onClick={() => setVista('lista')} className="text-blue-100 hover:text-white">← Volver</button>
                    <button 
                      onClick={() => window.print()} 
                      className="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg transition text-sm flex items-center gap-2"
                    >
                      🖨️ Imprimir / Descargar PDF
                    </button>
                  </div>
                  <h1 className="text-2xl font-bold mb-2">📊 Dashboard</h1>
                  <p className="text-blue-100">FERNI 3</p>
                </div>

                {/* Header para impresión */}
                <div className="print-only hidden">
                  <div className="text-center mb-6 pb-4 border-b-2 border-gray-300">
                    <h1 className="text-3xl font-bold text-gray-900 mb-2">FERNI - Dashboard de Incidencias</h1>
                    <p className="text-lg text-gray-600">FERNI 3</p>
                    <p className="text-sm text-gray-500 mt-2">Período: {getTextoPeriodo()}</p>
                    <p className="text-sm text-gray-500">Generado el {new Date().toLocaleDateString('es-AR', { day:'2-digit', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' })}</p>
                  </div>
                </div>

                <div className="p-6 space-y-6">
                  {/* Filtro de fechas */}
                  <div className="bg-white rounded-lg p-4 shadow no-print">
                    <h3 className="font-bold text-gray-800 mb-3">📅 Filtrar por período</h3>
                    
                    {/* Botones rápidos */}
                    <div className="flex flex-wrap gap-2 mb-4">
                      <button onClick={() => setFiltroFecha('todo')} className={`px-4 py-2 rounded-lg font-medium transition ${filtroFecha === 'todo' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                        Todo
                      </button>
                      <button onClick={() => setFiltroFecha('semana')} className={`px-4 py-2 rounded-lg font-medium transition ${filtroFecha === 'semana' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                        Esta semana
                      </button>
                      <button onClick={() => setFiltroFecha('mes')} className={`px-4 py-2 rounded-lg font-medium transition ${filtroFecha === 'mes' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                        Este mes
                      </button>
                      <button onClick={() => setFiltroFecha('mes_anterior')} className={`px-4 py-2 rounded-lg font-medium transition ${filtroFecha === 'mes_anterior' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                        Mes anterior
                      </button>
                      <button onClick={() => setFiltroFecha('personalizado')} className={`px-4 py-2 rounded-lg font-medium transition ${filtroFecha === 'personalizado' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                        Personalizado
                      </button>
                    </div>

                    {/* Date pickers (solo si es personalizado) */}
                    {filtroFecha === 'personalizado' && (
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">Desde</label>
                          <input 
                            type="date" 
                            value={fechaDesde} 
                            onChange={(e) => setFechaDesde(e.target.value)}
                            className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">Hasta</label>
                          <input 
                            type="date" 
                            value={fechaHasta} 
                            onChange={(e) => setFechaHasta(e.target.value)}
                            className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
                          />
                        </div>
                      </div>
                    )}

                    <div className="mt-3 text-sm text-gray-600">
                      📌 Mostrando: <span className="font-semibold">{getTextoPeriodo()}</span> ({reportesFiltrados.length} reportes)
                    </div>
                  </div>

                  {/* Estadísticas principales */}
                  <div className="grid grid-cols-2 gap-4">
                    <div className="bg-white rounded-lg p-4 shadow"><div className="text-3xl font-bold text-blue-600">{stats.total}</div><div className="text-sm text-gray-600">Total Reportes</div></div>
                    <div className="bg-white rounded-lg p-4 shadow"><div className="text-3xl font-bold text-red-600">{stats.abiertos}</div><div className="text-sm text-gray-600">Abiertos</div></div>
                    <div className="bg-white rounded-lg p-4 shadow"><div className="text-3xl font-bold text-green-600">{stats.resueltos}</div><div className="text-sm text-gray-600">Resueltos</div></div>
                    <div className="bg-white rounded-lg p-4 shadow"><div className="text-3xl font-bold text-purple-600">{stats.tasaResolucion}%</div><div className="text-sm text-gray-600">Tasa Resolución</div></div>
                  </div>

                  {statsPorSucursal && (
                    <div className="bg-white rounded-lg p-6 shadow">
                      <h2 className="text-xl font-bold text-gray-800 mb-4">Por Sucursal</h2>
                      <div className="space-y-3">
                        {statsPorSucursal.map(suc => (
                          <div key={suc.id} className="border-b border-gray-100 pb-3 last:border-0">
                            <div className="flex justify-between items-center mb-1">
                              <div className="font-semibold text-gray-800">{suc.nombre}</div>
                              <div className="flex items-center gap-3">
                                <span className="text-sm text-gray-600">{suc.total} reportes</span>
                                <span className={`px-3 py-1 rounded-full text-xs font-bold ${suc.tasaResolucion >= 80 ? 'bg-green-100 text-green-700' : suc.tasaResolucion >= 60 ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'}`}>{suc.tasaResolucion}%</span>
                              </div>
                            </div>
                            <div className="flex gap-4 text-xs">
                              <span className="text-red-600">{suc.abiertos} abiertos</span>
                              <span className="text-green-600">{suc.resueltos} resueltos</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="bg-white rounded-lg p-6 shadow">
                    <h2 className="text-xl font-bold text-gray-800 mb-4">Por Categoría</h2>
                    <div className="space-y-4">
                      {porCategoria.map(cat => (
                        <div key={cat.id}>
                          <div className="flex justify-between items-center mb-1">
                            <div className="flex items-center gap-2">
                              <span className="text-xl">{cat.icon}</span>
                              <span className="font-semibold text-gray-900">{cat.nombre}</span>
                            </div>
                            <span className="font-bold text-xl" style={{ color: cat.color }}>{cat.total}</span>
                          </div>
                          <div className="flex justify-end gap-4 text-xs">
