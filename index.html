                    <button onClick={onClose} className="flex-1 bg-gray-900 border border-gray-700 py-2 rounded-lg text-sm">Cancelar</button>
                    <button onClick={() => onSave({ entrada, salida })} className="flex-1 py-2 rounded-lg text-sm font-bold text-white" style={{ background: areaColor }}>Asignar turno</button>
                  </div>
                </div>
              </div>
            );
          };

          // ====== TABLERO CONSOLIDADO ======
          const HorariosTablero = ({ configHor, colaboradores, turnos, publicadoPorArea }) => {
            const franjas = generarFranjasHorarias(configHor.horarioApertura, configHor.horarioCierre);

            const porArea = {};
            configHor.areas.forEach(a => { porArea[a.id] = colaboradores.filter(c => c.area === a.id); });

            const totales = franjas.map(f => colaboradores.filter(c => colaboradorActivoEn(turnos[c.id], f)).length);
            const maxTotal = Math.max(...totales, 1);

            return (
              <div>
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2 mb-3">
                  {configHor.areas.map(a => (
                    <div key={a.id} className="bg-gray-800 rounded-lg p-2 border border-gray-700" style={{ borderLeft: `3px solid ${a.color}` }}>
                      <div className="text-[10px] text-gray-500 uppercase">{a.nombre}</div>
                      <div className={`text-xs font-medium ${publicadoPorArea[a.id] ? 'text-green-400' : 'text-yellow-400'}`}>
                        {publicadoPorArea[a.id] ? '✓ Publicado' : '◷ Borrador'}
                      </div>
                    </div>
                  ))}
                </div>

                <div className="bg-gray-800 rounded-xl border border-gray-700 overflow-auto">
                  <div style={{ minWidth: 140 + franjas.length * 24, display: 'inline-block' }}>
                    {/* Header de horas - solo redondas */}
                    <div className="flex bg-gray-900 border-b border-gray-700 sticky top-0 z-10">
                      <div style={{ width: 140, minWidth: 140 }} className="px-2 py-1.5 text-[11px] font-semibold text-gray-400 uppercase border-r border-gray-700">Rol</div>
                      {franjas.map(f => {
                        const redonda = f.endsWith(':00');
                        return (
                          <div key={f} style={{ width: 24, minWidth: 24, borderRight: redonda ? '1px solid #2A2A2A' : '1px solid rgba(42,42,42,0.13)' }} className="py-1.5 text-[11px] text-center">
                            {redonda ? <span className="text-gray-400 font-medium">{f.split(':')[0]}</span> : <span style={{ color: 'transparent' }}>·</span>}
                          </div>
                        );
                      })}
                    </div>

                    {/* Áreas */}
                    {configHor.areas.map(area => {
                      const colabs = porArea[area.id] || [];
                      if (colabs.length === 0) return null;
                      const tieneSubcats = area.subcategorias && area.subcategorias.length > 0;

                      // Función auxiliar para renderizar una fila de colaborador
                      const renderFila = (c) => {
                        const t = turnos[c.id] || {};
                        return (
                          <div key={c.id} className="flex border-b" style={{ borderColor: 'rgba(42,42,42,0.5)' }}>
                            <div style={{ width: 140, minWidth: 140, color: c.esLider ? '#FF4D4D' : '#F0EDE8', fontWeight: c.esLider ? 600 : 400 }} className="px-2 py-1 text-[11px] truncate border-r border-gray-700">{c.rol}</div>
                            {franjas.map(f => {
                              const activo = colaboradorActivoEn(t, f);
                              const redonda = f.endsWith(':00');
                              return (
                                <div key={f} title={activo ? `${c.nombre}${c.subcategoria ? ' (' + c.subcategoria + ')' : ''}` : ''} style={{
                                  width: 24, minWidth: 24, height: 22,
                                  background: activo ? area.color : 'transparent',
                                  borderRight: redonda ? '1px solid #2A2A2A' : '1px solid rgba(42,42,42,0.2)',
                                  opacity: c.esLider && activo ? 0.7 : 1
                                }}></div>
                              );
                            })}
                          </div>
                        );
                      };

                      // Header de área
                      const headerArea = (
                        <div className="flex bg-gray-900/50 border-b border-gray-700">
                          <div style={{ width: 140, minWidth: 140, color: area.color }} className="px-2 py-1 text-[11px] font-semibold uppercase border-r border-gray-700">{area.nombre}</div>
                          <div className="flex-1"></div>
                        </div>
                      );

                      if (tieneSubcats) {
                        // Agrupar colaboradores por sub-categoría
                        const porSubcat = {};
                        area.subcategorias.forEach(s => { porSubcat[s] = []; });
                        const sinSubcat = [];
                        colabs.forEach(c => {
                          if (c.subcategoria && porSubcat[c.subcategoria]) porSubcat[c.subcategoria].push(c);
                          else sinSubcat.push(c);
                        });

                        return (
                          <div key={area.id}>
                            {headerArea}
                            {area.subcategorias.map(s => {
                              const lista = porSubcat[s];
                              if (lista.length === 0) return null;
                              return (
                                <div key={s}>
                                  <div className="flex bg-gray-900/30 border-b" style={{ borderColor: 'rgba(42,42,42,0.5)' }}>
                                    <div style={{ width: 140, minWidth: 140, color: area.color, opacity: 0.75 }} className="pl-5 pr-2 py-0.5 text-[10px] uppercase border-r border-gray-700">↳ {s}</div>
                                    <div className="flex-1"></div>
                                  </div>
                                  {lista.map(renderFila)}
                                </div>
                              );
                            })}
                            {sinSubcat.length > 0 && (
                              <div>
                                <div className="flex bg-yellow-900/20 border-b" style={{ borderColor: 'rgba(42,42,42,0.5)' }}>
                                  <div style={{ width: 140, minWidth: 140, color: '#F1C40F', opacity: 0.85 }} className="pl-5 pr-2 py-0.5 text-[10px] uppercase border-r border-gray-700">⚠️ Sin sub-cat.</div>
                                  <div className="flex-1"></div>
                                </div>
                                {sinSubcat.map(renderFila)}
                              </div>
                            )}
                          </div>
                        );
                      }

                      // Sin sub-categorías: render plano
                      return (
                        <div key={area.id}>
                          {headerArea}
                          {colabs.map(renderFila)}
                        </div>
                      );
                    })}

                    {/* Totales */}
                    <div className="flex bg-gray-900 sticky bottom-0" style={{ borderTop: '2px solid #FF4D4D' }}>
                      <div style={{ width: 140, minWidth: 140 }} className="px-2 py-1.5 text-[11px] font-bold text-red-400 uppercase border-r border-gray-700">Total franja</div>
                      {totales.map((tot, i) => {
                        const intensidad = tot / maxTotal;
                        const color = tot === 0 ? '#444' : intensidad > 0.75 ? '#5DCAA5' : intensidad > 0.4 ? '#F0EDE8' : '#F1C40F';
                        const redonda = franjas[i].endsWith(':00');
                        return (
                          <div key={i} style={{ width: 24, minWidth: 24, color, borderRight: redonda ? '1px solid #2A2A2A' : '1px solid rgba(42,42,42,0.2)' }} className="py-1 text-[11px] text-center font-bold">{tot}</div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                <div className="mt-3 p-3 bg-gray-800 rounded-lg border border-gray-700 flex flex-wrap gap-3 text-xs text-gray-400">
                  {configHor.areas.map(a => (
                    <div key={a.id} className="flex items-center gap-1.5">
                      <span className="w-3 h-3 rounded-sm inline-block" style={{ background: a.color }}></span>
                      <span>{a.nombre}</span>
                    </div>
                  ))}
                  <div className="ml-auto text-red-400 font-medium">Líderes en rojo</div>
                </div>

                {colaboradores.length === 0 && (
                  <div className="text-center py-8 text-gray-500">
                    <div className="text-3xl mb-2">📊</div>
                    <div>El tablero está vacío. Cargá colaboradores y asigná turnos para verlos acá.</div>
                  </div>
                )}
              </div>
            );
          };

          // ========================================
          // MÓDULO VENCIMIENTOS
          // ========================================
          const VistaVencimientos = () => {
            const { setVista, usuario, esAdmin, esEncargadoVencimientos, rubroVto } = useApp();
            const puedeEditar = esAdmin || esEncargadoVencimientos;
            const sucursalVto = SUCURSAL_ID;

            const [items, setItems] = useState([]);
            const [cargandoVto, setCargandoVto] = useState(true);
            const [umbrales, setUmbrales] = useState({ critico: 7, alerta: 20 });
            const [umbralesEdit, setUmbralesEdit] = useState({ critico: 7, alerta: 20 });
            const [mostrandoUmbrales, setMostrandoUmbrales] = useState(false);
            const [errorUmbrales, setErrorUmbrales] = useState('');

            // Invitaciones (solo admin)
            const [invitaciones, setInvitaciones] = useState([]);
            const [mostrandoInvitaciones, setMostrandoInvitaciones] = useState(false);
            const [codigoGeneradoVto, setCodigoGeneradoVto] = useState(null);
            const [rubroParaInvitar, setRubroParaInvitar] = useState(RUBROS_VENCIMIENTOS[0].id);

            const [formEan, setFormEan] = useState('');
            const [formDesc, setFormDesc] = useState('');
            const [formVto, setFormVto] = useState('');
            const [formQty, setFormQty] = useState('');
            const [formRemito, setFormRemito] = useState('');
            const [formRubro, setFormRubro] = useState(esAdmin ? '' : (rubroVto || ''));
            const [formError, setFormError] = useState('');

            const [buscar, setBuscar] = useState('');
            const [filtroEst, setFiltroEst] = useState('');
            const [filtroRubro, setFiltroRubro] = useState('');
            const [editId, setEditId] = useState(null);
            const [editVto, setEditVto] = useState('');
            const [editQty, setEditQty] = useState('');
            const [editRemito, setEditRemito] = useState('');
            const [editRubro, setEditRubro] = useState('');
            const [deleteId, setDeleteId] = useState(null);

            const rubroInfo = (id) => AREAS_DEFAULT.find(a => a.id === id);

            const colRef = db.collection('vencimientos').doc(sucursalVto).collection('items');
            const configRef = db.collection('vencimientos').doc(sucursalVto);

            // Cargar items en tiempo real
            useEffect(() => {
              const unsub = colRef.onSnapshot(snap => {
                setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                setCargandoVto(false);
              });
              return () => unsub();
            }, [sucursalVto]);

            // Cargar config de umbrales
            useEffect(() => {
              configRef.get().then(doc => {
                if (doc.exists && doc.data().umbrales) {
                  const u = doc.data().umbrales;
                  setUmbrales(u);
                  setUmbralesEdit(u);
                }
              });
            }, [sucursalVto]);

            // Cargar invitaciones en tiempo real (solo admin)
            useEffect(() => {
              if (!esAdmin) return;
              const unsub = db.collection('vencimientos_invitaciones')
                .where('sucursal', '==', sucursalVto)
                .onSnapshot(snap => {
                  setInvitaciones(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
              return () => unsub();
            }, [sucursalVto, esAdmin]);

            const generarInvitacionVto = async () => {
              const sufijo = tokenSeguro(8);
              const rubroSufijo = rubroParaInvitar === 'todos' ? 'TODOS' : rubroParaInvitar.toUpperCase();
              const codigo = `VTO-${sucursalVto}-${rubroSufijo}-${sufijo}`;
              const nueva = {
                codigo,
                sucursal: sucursalVto,
                rubro: rubroParaInvitar,
                creadaPor: usuario,
                creadaEn: firebase.firestore.FieldValue.serverTimestamp(),
                expiraEn: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000), // 30 días
                revocado: false,
                usos: []
              };
              try {
                await db.collection('vencimientos_invitaciones').doc(codigo).set(nueva);
                setCodigoGeneradoVto(nueva);
              } catch(err) { alert('Error: ' + err.message); }
            };

            const revocarInvitacionVto = async (codigo) => {
              if (!confirm('¿Revocar este código? Los encargados que lo usaron perderán acceso al reiniciar sesión.')) return;
              try {
                await db.collection('vencimientos_invitaciones').doc(codigo).update({ revocado: true });
              } catch(err) { alert('Error: ' + err.message); }
            };

            const compartirWhatsAppVto = (inv) => {
              const nombreRubro = inv.rubro === 'todos' ? 'Perfumería y Golosinas' : rubroInfo(inv.rubro)?.nombre || inv.rubro || '';
              const mensaje = encodeURIComponent(
                `Hola! Te invito a ser encargado/a de Control de Vencimientos de *${nombreRubro}* en FERNI ${inv.sucursal}.\n\n` +
                `Tu código de acceso es: *${inv.codigo}*\n\n` +
                `Entrá a la app FERNI, elegí "Vencimientos" en el login y usá ese código. Vence en 30 días.`
              );
              abrirExterno(`https://wa.me/?text=${mensaje}`);
            };

            const diasHasta = (vto) => Math.ceil((new Date(vto) - new Date()) / 86400000);
            const getEstado = (vto) => {
              const d = diasHasta(vto);
              if (d < 0) return 'vencido';
              if (d <= umbrales.critico) return 'critico';
              if (d <= umbrales.alerta) return 'alerta';
              return 'normal';
            };
            const fmtF = (s) => { const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; };

            const aplicarUmbrales = async () => {
              setErrorUmbrales('');
              const c = parseInt(umbralesEdit.critico);
              const a = parseInt(umbralesEdit.alerta);
              if (isNaN(c) || isNaN(a) || c < 1 || a < 1) { setErrorUmbrales('Valores inválidos'); return; }
              if (c >= a) { setErrorUmbrales('Critico debe ser menor que Alerta'); return; }
              await configRef.set({ umbrales: { critico: c, alerta: a } }, { merge: true });
              setUmbrales({ critico: c, alerta: a });
              setMostrandoUmbrales(false);
            };

            const agregarItem = async () => {
              setFormError('');
              if (!formEan.trim() || !formDesc.trim() || !formVto) { setFormError('EAN/SKU, descripcion y vencimiento son obligatorios.'); return; }
              if (!formRubro) { setFormError('Seleccioná el rubro del producto.'); return; }
              await colRef.add({
                ean: formEan.trim(),
                desc: formDesc.trim(),
                vto: formVto,
                qty: formQty ? parseInt(formQty) : null,
                remito: formRemito.trim(),
                rubro: formRubro,
                creadoPor: usuario,
                creadoEn: firebase.firestore.FieldValue.serverTimestamp()
              });
              setFormEan(''); setFormDesc(''); setFormVto(''); setFormQty(''); setFormRemito('');
              if (esAdmin) setFormRubro('');
            };

            const guardarEdicion = async (id) => {
              if (!editVto) return;
              await colRef.doc(id).update({
                vto: editVto,
                qty: editQty ? parseInt(editQty) : null,
                remito: editRemito,
                rubro: editRubro || null,
                editadoPor: usuario,
                editadoEn: firebase.firestore.FieldValue.serverTimestamp()
              });
              setEditId(null);
            };

            const confirmarEliminar = async (id) => {
              await colRef.doc(id).delete();
              setDeleteId(null);
            };

            const estadoStyle = {
              vencido: { bg: 'rgba(192,57,43,0.12)', badge: '#fdecea', badgeText: '#922B21', badgeBorder: '#C0392B', diasColor: '#C0392B', label: 'Vencido' },
              critico: { bg: 'rgba(230,126,34,0.08)', badge: '#fef3e2', badgeText: '#7D4E05', badgeBorder: '#E67E22', diasColor: '#E67E22', label: 'Critico' },
              alerta:  { bg: 'rgba(41,128,185,0.06)', badge: '#dff0fb', badgeText: '#1A5276', badgeBorder: '#2980B9', diasColor: '#2980B9', label: 'Alerta' },
              normal:  { bg: 'transparent',          badge: '#e0f6f5', badgeText: '#0E6655', badgeBorder: '#4ECDC4', diasColor: '#0E6655', label: 'Normal' }
            };

            // Alcance por rubro: un encargado solo ve su rubro asignado; "todos" ve ambos; el admin ve todo o filtra;
            // un usuario normal (solo lectura) ve todos los rubros
            const itemsScope = esAdmin
              ? (filtroRubro ? items.filter(it => it.rubro === filtroRubro) : items)
              : esEncargadoVencimientos
                ? (rubroVto === 'todos' ? items : items.filter(it => it.rubro === rubroVto))
                : items;

            const visible = itemsScope.filter(it => {
              const m = it.ean?.toLowerCase().includes(buscar.toLowerCase()) || it.desc?.toLowerCase().includes(buscar.toLowerCase());
              return m && (!filtroEst || getEstado(it.vto) === filtroEst);
            }).sort((a, b) => diasHasta(a.vto) - diasHasta(b.vto));

            const cnt = { vencido: 0, critico: 0, alerta: 0, normal: 0 };
            itemsScope.forEach(it => cnt[getEstado(it.vto)]++);

            const headerStyle = { background: '#1E3A5F', color: 'white', padding: '16px 20px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' };
            const secStyle = { background: '#1A1A1A', border: '1px solid #2A2A2A', borderRadius: 10, padding: '16px 18px', marginBottom: 14 };
            const labelStyle = { display: 'block', fontSize: 11, color: '#888', textTransform: 'uppercase', letterSpacing: '0.4px', marginBottom: 4, fontWeight: 500 };
            const inputStyle = { width: '100%', padding: '8px 10px', border: '1px solid #3A3A3A', borderRadius: 6, fontSize: 13, background: '#222', color: '#F0EDE8' };

            return (
              <div style={{ minHeight: '100vh', background: '#0F0F0F', fontFamily: 'Outfit, sans-serif', paddingBottom: 80 }}>
                {/* Header */}
                <div style={headerStyle}>
                  <div>
                    <div style={{ fontSize: 17, fontWeight: 600 }}>Vencimientos</div>
                    <div style={{ fontSize: 11, opacity: 0.6 }}>FERNI 3 · {esAdmin ? 'Admin' : esEncargadoVencimientos ? `Encargado · ${rubroVto === 'todos' ? 'Todos los rubros' : rubroInfo(rubroVto)?.nombre || 'Sin rubro asignado'}` : 'Solo lectura'}</div>
                  </div>
                  <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap', justifyContent: 'flex-end' }}>
                    {esAdmin && (
                      <button onClick={() => { setMostrandoInvitaciones(!mostrandoInvitaciones); setMostrandoUmbrales(false); }}
                        style={{ background: mostrandoInvitaciones ? 'rgba(255,107,53,0.4)' : 'rgba(255,255,255,0.15)', color: 'white', border: 'none', padding: '6px 12px', borderRadius: 8, fontSize: 12, cursor: 'pointer' }}>
                        Encargados
                      </button>
                    )}
                    {puedeEditar && (
                      <button onClick={() => { setMostrandoUmbrales(!mostrandoUmbrales); setMostrandoInvitaciones(false); }}
                        style={{ background: 'rgba(255,255,255,0.15)', color: 'white', border: 'none', padding: '6px 12px', borderRadius: 8, fontSize: 12, cursor: 'pointer' }}>
                        Umbrales
                      </button>
                    )}
                    <button onClick={() => setVista('lista')}
                      style={{ background: 'rgba(255,255,255,0.15)', color: 'white', border: 'none', padding: '6px 12px', borderRadius: 8, fontSize: 12, cursor: 'pointer' }}>
                      ← Inicio
                    </button>
                  </div>
                </div>

                <div style={{ padding: '16px 14px', maxWidth: 900, margin: '0 auto' }}>

                  {/* KPIs */}
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 10, marginBottom: 14 }}>
                    {[
                      { key: 'vencido', label: 'Vencidos',     color: '#C0392B' },
                      { key: 'critico', label: `Critico ≤${umbrales.critico}d`, color: '#E67E22' },
                      { key: 'alerta',  label: `Alerta ≤${umbrales.alerta}d`,  color: '#2980B9' },
                      { key: 'normal',  label: 'Normal',       color: '#4ECDC4' }
                    ].map(k => (
                      <div key={k.key} style={{ background: '#1A1A1A', border: `1px solid #2A2A2A`, borderLeft: `4px solid ${k.color}`, borderRadius: 8, padding: '12px 14px' }}>
                        <div style={{ fontSize: 10, color: '#888', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: 4 }}>{k.label}</div>
                        <div style={{ fontSize: 22, fontWeight: 700, color: k.color }}>{cnt[k.key]}</div>
                      </div>
                    ))}
                  </div>

                  {/* Panel umbrales */}
                  {mostrandoUmbrales && puedeEditar && (
                    <div style={secStyle}>
                      <div style={{ fontSize: 13, fontWeight: 600, color: '#F0EDE8', marginBottom: 14 }}>Configurar umbrales de estado</div>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                        <div>
                          <label style={labelStyle}>Critico: hasta X dias</label>
                          <input type="number" min="1" value={umbralesEdit.critico}
                            onChange={(e) => setUmbralesEdit(u => ({...u, critico: e.target.value}))}
                            style={{...inputStyle, width: 90, textAlign: 'center', fontWeight: 700, color: '#E67E22'}} />
                        </div>
                        <div>
                          <label style={labelStyle}>Alerta: hasta X dias</label>
                          <input type="number" min="1" value={umbralesEdit.alerta}
                            onChange={(e) => setUmbralesEdit(u => ({...u, alerta: e.target.value}))}
                            style={{...inputStyle, width: 90, textAlign: 'center', fontWeight: 700, color: '#2980B9'}} />
                        </div>
                      </div>
                      {errorUmbrales && <div style={{ color: '#FF6B6B', fontSize: 12, marginTop: 8 }}>{errorUmbrales}</div>}
                      <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
                        <button onClick={aplicarUmbrales} style={{ background: '#1E3A5F', color: 'white', border: 'none', padding: '8px 18px', borderRadius: 6, fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>Guardar</button>
                        <button onClick={() => setMostrandoUmbrales(false)} style={{ background: '#2A2A2A', color: '#aaa', border: 'none', padding: '8px 14px', borderRadius: 6, fontSize: 13, cursor: 'pointer' }}>Cancelar</button>
                      </div>
                    </div>
                  )}

                  {/* Panel invitaciones — solo admin */}
                  {mostrandoInvitaciones && esAdmin && (
                    <div style={secStyle}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14, flexWrap: 'wrap', gap: 10 }}>
                        <div style={{ fontSize: 13, fontWeight: 600, color: '#F0EDE8' }}>Encargados de vencimientos — {sucursalVto}</div>
                        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                          <select value={rubroParaInvitar} onChange={e => setRubroParaInvitar(e.target.value)} style={{ ...inputStyle, width: 'auto' }}>
                            {RUBROS_VENCIMIENTOS.map(a => <option key={a.id} value={a.id}>{a.nombre}</option>)}
                            <option value="todos">Ambos rubros</option>
                          </select>
                          <button onClick={generarInvitacionVto}
                            style={{ background: '#FF6B35', color: 'white', border: 'none', padding: '7px 16px', borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: 'pointer', whiteSpace: 'nowrap' }}>
                            + Generar código
                          </button>
                        </div>
                      </div>

                      {invitaciones.length === 0 ? (
                        <div style={{ color: '#666', fontSize: 13, textAlign: 'center', padding: '16px 0' }}>No hay códigos generados. Generá uno para invitar a un encargado.</div>
                      ) : (
                        invitaciones.map(inv => {
                          const expiraEn = getFecha(inv.expiraEn);
                          const expirado = expiraEn && Date.now() > expiraEn.getTime();
                          const dias = expiraEn ? Math.max(0, Math.ceil((expiraEn.getTime() - Date.now()) / 86400000)) : 0;
                          const activo = !inv.revocado && !expirado;
                          const usos = inv.usos || [];
                          return (
                            <div key={inv.codigo} style={{ background: '#222', borderRadius: 8, padding: '12px 14px', marginBottom: 8, border: `1px solid ${inv.revocado ? '#3A1A1A' : expirado ? '#2A2A2A' : '#2A3A2A'}` }}>
                              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 8 }}>
                                <div>
                                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                                    <div style={{ fontFamily: 'monospace', fontSize: 16, fontWeight: 700, letterSpacing: '0.1em', color: inv.revocado ? '#555' : expirado ? '#666' : '#4ECDC4' }}>{inv.codigo}</div>
                                    {inv.rubro && (
                                      <span style={{ fontSize: 10, fontWeight: 600, color: inv.rubro === 'todos' ? '#4ECDC4' : rubroInfo(inv.rubro)?.color || '#aaa', border: `1px solid ${inv.rubro === 'todos' ? '#4ECDC4' : rubroInfo(inv.rubro)?.color || '#444'}`, borderRadius: 10, padding: '2px 8px' }}>
                                        {inv.rubro === 'todos' ? 'Ambos rubros' : rubroInfo(inv.rubro)?.nombre || inv.rubro}
                                      </span>
                                    )}
                                  </div>
                                  <div style={{ fontSize: 11, color: '#666', marginTop: 3 }}>
                                    {inv.revocado && <span style={{ color: '#FF6B6B' }}>Revocado</span>}

        function FerniApp() {
          const sesionGuardada = cargarSesion();

          const [vista, setVista] = useState(
            sesionGuardada
              ? (sesionGuardada.esLider ? 'horarios' : sesionGuardada.esEncargadoVencimientos ? 'vencimientos' : 'lista')
              : 'login'
          );
          const [usuario, setUsuario] = useState(sesionGuardada?.usuario || null);
          const [usuarioEmail, setUsuarioEmail] = useState(sesionGuardada?.usuarioEmail || null);
          const [sucursalUsuario, setSucursalUsuario] = useState(sesionGuardada?.sucursalUsuario || null);
          const [sucursalActiva, setSucursalActiva] = useState(sesionGuardada?.sucursalActiva || null);
          const [esAdmin, setEsAdmin] = useState(sesionGuardada?.esAdmin || false);
          const [esGerente, setEsGerente] = useState(sesionGuardada?.esGerente || false);
          const [esLider, setEsLider] = useState(sesionGuardada?.esLider || false);
          const [areaLider, setAreaLider] = useState(sesionGuardada?.areaLider || null);
          const [esEncargadoVencimientos, setEsEncargadoVencimientos] = useState(sesionGuardada?.esEncargadoVencimientos || false);
          const [rubroVto, setRubroVto] = useState(sesionGuardada?.rubroVto || null);
          const [reportes, setReportes] = useState([]);
          const [reportesNuevos, setReportesNuevos] = useState([]);
          const [contadorNuevos, setContadorNuevos] = useState(0);
          const [filtroEstado, setFiltroEstado] = useState('todos');
          const [reporteActual, setReporteActual] = useState(null);
          const [cargando, setCargando] = useState(false);
          const [deepLinkId, setDeepLinkId] = useState(null);

          // Detectar deep link al cargar
          useEffect(() => {
            const hash = window.location.hash;
            const match = hash.match(/^#reporte-([A-Za-z0-9_-]{1,64})$/);
            if (match) {
              setDeepLinkId(match[1]);
            }
          }, []);

          // Sincronizar reporteActual con el snapshot en tiempo real
          useEffect(() => {
            if (reporteActual) {
              const actualizado = reportes.find(r => r.id === reporteActual.id);
              if (actualizado) setReporteActual(actualizado);
            }
          }, [reportes]);

          // Redirigir a deep link cuando llegan los reportes y el usuario ya está logueado
          useEffect(() => {
            if (deepLinkId && usuario && reportes.length > 0) {
              const reporte = reportes.find(r => r.id === deepLinkId);
              if (reporte) {
                setReporteActual(reporte);
                setVista('detalle');
                setDeepLinkId(null); // limpiar para no volver a ejecutar
                window.location.hash = ''; // limpiar la URL
              }
            }
          }, [deepLinkId, usuario, reportes]);

          // Limpieza automática (solo admins)
          useEffect(() => {
            if (esAdmin || esGerente) {
              limpiarFotosViejas();
            }
          }, [esAdmin, esGerente]);

          // Espejo de `reportes` en un ref: el callback de onSnapshot se crea una sola
          // vez y capturaba el valor inicial ([]), por lo que "reportes nuevos"
          // marcaba TODA la lista como nueva en cada actualizacion.
          const reportesRef = useRef([]);
          useEffect(() => { reportesRef.current = reportes; }, [reportes]);

          // Cargar reportes en vivo
          useEffect(() => {
            if (!usuario || !sucursalActiva) return;
            if (esLider) return; // Los lideres no necesitan reportes de incidencias

            const ultimaVisitaKey = `ultimaVisita_${sucursalActiva}`;
            const ultimaVisita = localStorage.getItem(ultimaVisitaKey);
            const timestampUltimaVisita = ultimaVisita ? new Date(ultimaVisita) : new Date(0);

            let primeraVez = true;
            let activo = true;
            let unsubscribe = null;

            const manejarSnapshot = (snapshot) => {
              const data = snapshot.docs.map(doc => Object.assign({ id: doc.id }, doc.data()));

              data.sort((a, b) => {
                const fa = getFecha(a.fecha_creacion) || new Date(0);
                const fb = getFecha(b.fecha_creacion) || new Date(0);
                return fb - fa;
              });

              setContadorNuevos(data.filter(r => {
                const fecha = getFecha(r.fecha_creacion);
                return fecha && fecha > timestampUltimaVisita;
              }).length);

              if (!primeraVez) {
                const idsAnteriores = new Set(reportesRef.current.map(r => r.id));
                const recienLlegados = data.filter(r => !idsAnteriores.has(r.id)).map(r => r.id);
                if (recienLlegados.length > 0) {
                  setReportesNuevos(recienLlegados);
                  setTimeout(() => { if (activo) setReportesNuevos([]); }, 5000);
                }
              }
              primeraVez = false;
              setReportes(data);
            };

            // Preferimos la consulta ordenada y acotada (menos datos, menos costo).
            // Necesita un indice compuesto sucursal + fecha_creacion; si todavia no
            // existe, Firestore devuelve 'failed-precondition' y caemos a la consulta
            // simple de siempre en vez de dejar la pantalla vacia.
            const suscribir = (conIndice) => {
              let q = db.collection('reportes').where('sucursal', '==', SUCURSAL_ID);
              if (conIndice) q = q.orderBy('fecha_creacion', 'desc').limit(LIMITE_REPORTES);
              return q.onSnapshot(manejarSnapshot, (err) => {
                if (conIndice && (err.code === 'failed-precondition' || err.code === 'invalid-argument')) {
                  console.warn('Indice compuesto no disponible, uso consulta sin orden:', err.message);
                  if (activo) unsubscribe = suscribir(false);
                } else {
                  console.error('Error al escuchar reportes:', err);
                }
              });
            };

            unsubscribe = suscribir(true);
            return () => { activo = false; if (unsubscribe) unsubscribe(); };
          }, [usuario, sucursalActiva, esLider]);

          // Revalidacion de permisos: la unica fuente de verdad es Firebase Auth
          // + el documento admins/{uid}. Nada de lo guardado en localStorage otorga
          // privilegios por si solo.
          useEffect(() => {
            let cancelado = false;
            const unsub = auth.onAuthStateChanged(async (user) => {
              if (!user) { await asegurarAuth(); return; }
              const perfil = await obtenerPerfilAdmin(user);
              if (cancelado) return;
              setEsAdmin(!!perfil);
              setEsGerente(!!perfil);
            });
            return () => { cancelado = true; unsub(); };
          }, []);

          // Cierre de sesion unificado (tambien cierra la sesion de Firebase Auth)
          const cerrarSesionTotal = async () => {
            borrarSesion();
            try { await auth.signOut(); } catch (e) { /* sin conexion */ }
            setUsuario(null); setUsuarioEmail(null);
            setSucursalUsuario(null); setSucursalActiva(null);
            setEsAdmin(false); setEsGerente(false);
            setEsLider(false); setAreaLider(null);
            setEsEncargadoVencimientos(false); setRubroVto(null);
            setReportes([]); setReporteActual(null);
            setVista('login');
            asegurarAuth();
          };

          const ctx = {
            vista, setVista,
            usuario, setUsuario,
            usuarioEmail, setUsuarioEmail,
            sucursalUsuario, setSucursalUsuario,
            sucursalActiva, setSucursalActiva,
            esAdmin, setEsAdmin,
            esGerente, setEsGerente,
            esLider, setEsLider,
            areaLider, setAreaLider,
            esEncargadoVencimientos, setEsEncargadoVencimientos,
            rubroVto, setRubroVto,
            reportes, setReportes,
            reportesNuevos, setReportesNuevos,
            contadorNuevos, setContadorNuevos,
            filtroEstado, setFiltroEstado,
            reporteActual, setReporteActual,
            cargando, setCargando,
            cerrarSesionTotal
          };

          return (
            <AppCtx.Provider value={ctx}>
              <div>
                {vista === 'login' && <VistaLogin />}
                {vista === 'lista' && <VistaLista />}
                {vista === 'crear' && <VistaCrear />}
                {vista === 'detalle' && <VistaDetalle />}
                {vista === 'dashboard' && <VistaDashboard />}
                {vista === 'horarios' && <VistaHorarios />}
                {vista === 'asistente' && <VistaAsistente />}
                {vista === 'vencimientos' && <VistaVencimientos />}
                <TabBar />
              </div>
            </AppCtx.Provider>
          );
        }

        // Evita la pantalla en blanco: si un componente lanza una excepcion, se
        // muestra un aviso con boton de recarga en lugar de dejar el <div id="root"> vacio.
        class ErrorBoundary extends React.Component {
          constructor(props) { super(props); this.state = { error: null }; }
          static getDerivedStateFromError(error) { return { error }; }
          componentDidCatch(error, info) { console.error('Error no controlado en la UI:', error, info); }
          render() {
            if (!this.state.error) return this.props.children;
            return (
              <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, textAlign: 'center' }}>
                <div>
                  <div style={{ fontSize: 42, marginBottom: 12 }}>⚠️</div>
                  <h1 style={{ fontSize: 18, fontWeight: 600, marginBottom: 8 }}>Algo salió mal</h1>
                  <p style={{ fontSize: 13, opacity: 0.7, marginBottom: 18, maxWidth: 320 }}>
                    La app se encontró con un error inesperado. Podés recargar y seguir trabajando.
                  </p>
                  <button type="button" onClick={() => window.location.reload()}
                    style={{ background: '#F0EDE8', color: '#0F0F0F', border: 'none', borderRadius: 10, padding: '10px 20px', fontWeight: 600, cursor: 'pointer' }}>
                    Recargar
                  </button>
                </div>
              </div>
            );
          }
        }

        // Sesion anonima apenas arranca: asi la primera lectura ya viaja autenticada.
        asegurarAuth();

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><FerniApp /></ErrorBoundary>);
    </script>

    <style>
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Estilos para impresión */
        @media print {
            /* Ocultar elementos de navegación */
            .no-print {
                display: none !important;
            }

            /* Mostrar header especial para impresión */
            .print-only {
                display: block !important;
            }

            /* Optimizar página */
            body {
                background: white !important;
            }

            #dashboard-container {
                background: white !important;
                min-height: auto !important;
            }

            /* Evitar saltos de página dentro de elementos */
            .bg-white {
                page-break-inside: avoid;
                break-inside: avoid;
            }

            /* Ajustar márgenes y padding para impresión */
            .p-6 {
                padding: 1rem !important;
            }

            /* Asegurar que los colores se impriman */
            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            /* Ajustar tamaños de fuente para papel */
            .text-3xl {
                font-size: 1.5rem !important;
            }

            .text-2xl {
                font-size: 1.25rem !important;
            }

            .text-xl {
                font-size: 1.1rem !important;
            }

            /* Agregar bordes sutiles para mejor legibilidad */
            .shadow {
                box-shadow: none !important;
                border: 1px solid #e5e7eb !important;
            }
        }
    </style>
</body>
